name: CMS Editorial Auto-Deploy (InsForge Sites)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cms-auto-deploy
  cancel-in-progress: true

jobs:
  deploy-insforge:
    name: Deploy Frontend to InsForge Sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure InsForge CLI credentials
        env:
          INSFORGE_CREDENTIALS_JSON: ${{ secrets.INSFORGE_CREDENTIALS_JSON }}
          INSFORGE_PROJECT_JSON: ${{ secrets.INSFORGE_PROJECT_JSON }}
        run: |
          mkdir -p ~/.insforge .insforge
          printf '%s' "$INSFORGE_CREDENTIALS_JSON" > ~/.insforge/credentials.json
          printf '%s' "$INSFORGE_PROJECT_JSON" > .insforge/project.json

      - name: Ensure post count stays under upload limit
        run: node scripts/pack-posts-archive.mjs

      - name: Deploy to InsForge Sites
        run: npx --yes @insforge/cli@latest deployments deploy . --yes

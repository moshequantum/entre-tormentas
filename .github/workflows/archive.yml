name: Rebuild archivo histórico (anual)

# Corre solo el 1 de enero: mueve el año que terminó al Worker de archivo y
# vuelve a publicar el sitio vivo con el nuevo año en curso.
on:
  schedule:
    - cron: '30 4 1 1 *'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: entre-tormentas-cms
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + deploy archivo
        run: |
          pnpm run build:archive
          pnpm exec wrangler deploy -c wrangler.archive.jsonc
      - name: Build + deploy sitio vivo
        run: |
          pnpm run build
          pnpm exec wrangler deploy

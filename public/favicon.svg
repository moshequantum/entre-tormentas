<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Storm Squircle Background -->
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <!-- Vivid Electric Lightning Bolt Gradient -->
    <linearGradient id="fav-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <!-- Crisp White Cloud Outline Gradient -->
    <linearGradient id="fav-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38BDF8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- High-Contrast Squircle Tile (Ensures instant visibility on both light and dark browser tabs) -->
  <rect width="64" height="64" rx="15" fill="url(#fav-bg)" />
  <rect width="63" height="63" x="0.5" y="0.5" rx="14.5" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />

  <!-- Entre Tormentas Brand Mark: Crisp Light Cloud + Vivid Electric Trueno on Dark Background -->
  <g transform="translate(6, 6) scale(0.52)">
    <!-- Light Cloud (Nube blanca nítida) -->
    <path
      d="M 36 60 L 24 60 C 14 60 14 43 23 40 C 21 27 36 21 44 26 C 50 12 70 12 74 26 C 85 26 89 38 85 47 C 91 58 83 60 76 60 L 64 60"
      stroke="url(#fav-cloud)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Trueno Eléctrico Central -->
    <polygon
      points="53,53 63,53 52,67 59,67 40,88 47,71 39,71"
      fill="url(#fav-bolt)"
      stroke="url(#fav-bolt)"
      stroke-width="1.8"
      stroke-linejoin="round"
      filter="url(#fav-glow)"
    />

    <!-- Trazos de lluvia eléctrica cian -->
    <line x1="29" y1="69" x2="20" y2="81" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" />
    <line x1="74" y1="71" x2="65" y2="83" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" />
  </g>
</svg>

    <line x1="29" y1="69" x2="20" y2="81" stroke="url(#fav-blue)" stroke-width="6.5" stroke-linecap="round" />
    <line x1="74" y1="71" x2="65" y2="83" stroke="url(#fav-blue)" stroke-width="6.5" stroke-linecap="round" />

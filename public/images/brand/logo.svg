  />
  <!-- Central Lightning Bolt (El Trueno) -->
  <polygon
    points="53,53 63,53 52,67 59,67 40,88 47,71 39,71"
    fill="url(#et-brand-grad)"
    stroke="url(#et-brand-grad)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- Rain Streaks (Lluvia de Tormenta) -->
  <line x1="29" y1="69" x2="20" y2="81" stroke="url(#et-brand-grad)" stroke-width="6" stroke-linecap="round" />
  <line x1="74" y1="71" x2="65" y2="83" stroke="url(#et-brand-grad)" stroke-width="6" stroke-linecap="round" />
</svg>

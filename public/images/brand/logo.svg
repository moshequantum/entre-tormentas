<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="et-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Cloud outline with rounded stroke caps -->
  <path
    d="M 36 60 L 24 60 C 14 60 14 43 23 40 C 21 27 36 21 44 26 C 50 12 70 12 74 26 C 85 26 89 38 85 47 C 91 58 83 60 76 60 L 64 60"
    stroke="url(#et-brand-grad)"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="etGrad" x1="10" y1="10" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0038B8"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base emblem container (Obsidian Duotone) -->
  <rect width="160" height="160" rx="32" fill="#070A11"/>
  <rect width="160" height="160" rx="32" fill="url(#innerGlow)"/>
  <rect x="1" y="1" width="158" height="158" rx="31" stroke="#232D42" stroke-width="2"/>

  <!-- Monogram E + T Minimalist Storm Interlock -->
  <g transform="translate(30, 26)">
    <!-- Top Horizon Bar (T roof) -->
    <path d="M 0 0 L 100 0 L 88 18 L 12 18 L 0 0 Z" fill="url(#etGrad)"/>
    
    <!-- Catatumbo Lightning Fracture (Dynamic negative/positive energy strike) -->
    <!-- Strike down -->
    <path d="M 58 14 L 76 14 L 38 64 L 58 64 L 16 108 L 32 58 L 14 58 Z" fill="#FFFFFF"/>
    <path d="M 58 14 L 76 14 L 38 64 L 58 64 L 16 108 L 32 58 L 14 58 Z" stroke="#00D2FF" stroke-width="2" stroke-linejoin="round"/>

    <!-- E Wings (Middle & Bottom Stabilizers) -->
    <path d="M 0 28 L 16 28 L 16 48 L 30 48 L 24 64 L 0 64 Z" fill="url(#etGrad)"/>
    <path d="M 0 74 L 24 74 L 14 94 L 72 94 L 64 108 L 0 108 Z" fill="url(#etGrad)"/>
  </g>
</svg>
